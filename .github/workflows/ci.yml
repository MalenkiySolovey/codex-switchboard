name: CI Build & Test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore CodexSwitcher.slnx

      - name: Build Solution (Release)
        run: dotnet build CodexSwitcher.slnx -c Release --no-restore

      - name: Run Offline Test Suite
        run: dotnet test CodexSwitcher.slnx -c Release --no-build --verbosity normal
